<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Credit Path AI - Loan Scam Checker</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>


<body>
  <h1>Credit Path AI - Loan Scam Checker</h1>

  <div id="borrowers"></div>
  <button class="add-btn" onclick="addBorrower()">+ Add Borrower</button>
  <button onclick="submitData()">Check Loan Scams</button>

  <div id="results"></div>

  <script>
    let borrowerCount = 0;

    function addBorrower() {
      borrowerCount++;
      const div = document.createElement('div');
      div.className = 'borrower';
      div.innerHTML = `
        <h3>Borrower ${borrowerCount}</h3>
        <label>Name:</label><input type="text" name="name" /><br/>
        <label>Email:</label><input type="email" name="email" /><br/>
        <label>Income:</label><input type="number" name="income" /><br/>
        <label>Loan Amount:</label><input type="number" name="loan_amount" /><br/>
        <label>Credit Score:</label><input type="number" name="credit_score" /><br/>
        <label>Employment Years:</label><input type="number" step="0.1" name="employment_years" /><br/>
        <label>Purpose:</label><textarea name="purpose"></textarea>
        <br><button onclick="this.parentNode.remove()">Remove</button>
      `;
      document.getElementById('borrowers').appendChild(div);
    }

    async function submitData() {
      const borrowers = Array.from(document.querySelectorAll('.borrower')).map(b => {
        const obj = {};
        b.querySelectorAll('input, textarea').forEach(inp => obj[inp.name] = inp.value);
        return obj;
      });

      const resDiv = document.getElementById('results');
      resDiv.innerHTML = "<p>Checking...</p>";

      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({borrowers})
        });

        const data = await res.json();

        resDiv.innerHTML = '<h3>Results</h3>' + data.results.map(r => `
          <div class="result-card">
            <b>${r.name || 'Unknown'} (${r.email || ''})</b>
            ${r.error ? `<span class="error">Errors: ${r.errors.join(', ')}</span>` :
            `<span><b>Risk:</b> ${r.scam_risk} (${r.scam_label})</span>
             <span><b>Score:</b> ${r.scam_score}</span>
             <span><b>Recommendation:</b> ${r.recommendation}</span>
             <span><small>${r.reasons.join('; ')}</small></span>`}
          </div>
        `).join('');

      } catch(err) {
        resDiv.innerHTML = `<p class="error">Error: ${err}</p>`;
      }
    }

    // Add one borrower form by default
    addBorrower();
  </script>
</body>
</html>
